name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 libpango-1.0-0 libgl1 libegl1
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Check dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Test
        run: go test ./...
      - name: Race check
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Build an independent consumer
        run: |
          module_dir=$(pwd -P)
          if [ "$RUNNER_OS" = "Windows" ]; then
            module_dir=$(cygpath -m "$module_dir")
          fi
          consumer_dir=$(mktemp -d)
          trap 'rm -rf "$consumer_dir"' EXIT
          cp -R examples/desktop/. "$consumer_dir/"
          cd "$consumer_dir"
          go mod init example.com/onevra-consumer
          go mod edit -require=github.com/oneo-me/onevra/source@v0.2026.1
          go mod edit "-replace=github.com/oneo-me/onevra/source=$module_dir"
          go mod tidy
          go build ./...
      - name: Check whitespace
        run: git -C .. diff --check
