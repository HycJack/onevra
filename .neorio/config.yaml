icon: source/assets/icon.png
tasks:
  - label: Run
    group: run
    command: go
    args: [tool, mygo, dev]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Build
    group: build
    command: go
    args: [tool, mygo, build, -platform, "darwin/arm64,windows/amd64,linux/amd64,linux/arm64"]
    options:
      cwd: source
      env:
        GOWORK: "off"
    outputDirectory: ../dist
  - label: Run desktop example
    command: go
    args: [run, ./examples/desktop]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Run hybrid example
    command: go
    args: [run, ./examples/hybrid]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Run menubar example
    command: go
    args: [run, ./examples/menubar]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Run launcher example
    command: go
    args: [run, ./examples/launcher]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Run documents example
    command: go
    args: [run, ./examples/documents]
    options:
      cwd: source
      env:
        GOWORK: "off"
  - label: Website
    type: shell
    command: bun install && bun run dev
    options:
      cwd: website
